name: Validate original Kestra blueprint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared validation dependency
        run: python -m pip install -r requirements-validation.txt
      - name: Generate isolated test-server credentials
        run: |
          python - <<'PY'
          import os
          import secrets
          password = "Aa1-" + secrets.token_urlsafe(32)
          print(f"::add-mask::{password}")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"KESTRA_TEST_PASSWORD={password}\n")
          PY
      - name: Validate on real, isolated Kestra 2.0.6
        env:
          KESTRA_TEST_USERNAME: blueprint-ci@example.invalid
          KESTRA_CONFIGURATION: |
            micronaut:
              server:
                host: 127.0.0.1
            kestra:
              server:
                basic-auth:
                  username: ${KESTRA_TEST_USERNAME}
                  password: ${KESTRA_TEST_PASSWORD}
              tasks:
                tmp-dir:
                  path: /tmp/kestra-wd/tmp
        run: |
          set -euo pipefail
          cleanup() {
            code=$?
            if docker inspect kestra-blueprint >/dev/null 2>&1; then
              docker logs --tail 150 kestra-blueprint
              docker rm --force kestra-blueprint
            fi
            exit "$code"
          }
          trap cleanup EXIT
          docker run --detach --name kestra-blueprint --network host --user root \
            --env KESTRA_CONFIGURATION \
            --env KESTRA_TEST_USERNAME \
            --env KESTRA_TEST_PASSWORD \
            --env JAVA_OPTS="-Xms256m -Xmx2g" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume /tmp:/tmp \
            kestra/kestra:v2.0.6 server local
          python scripts/validate_blueprint.py
